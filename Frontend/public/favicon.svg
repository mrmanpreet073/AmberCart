<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Amber Gradient Background -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shiny Hexagon Surface Accent Gradient -->
    <linearGradient id="hexGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#amberGrad)" />

  <!-- Hexagonal Cart Base Shell -->
  <path 
    d="M32 10 L48 19 V37 L32 46 L16 37 V19 Z" 
    fill="url(#hexGrad)" 
    stroke="#ffffff" 
    stroke-width="2.5" 
    stroke-linejoin="round"
  />

  <!-- Cart Interior Basket Cutout Handle/Lines -->
  <path 
    d="M22 22 H42 L38 34 H26 Z" 
    fill="#ffffff" 
    opacity="0.95" 
  />

  <!-- Front/Back Wheels (Stylized Dark Accents) -->
  <circle cx="26" cy="48" r="3.5" fill="#1c1917" />
  <circle cx="38" cy="48" r="3.5" fill="#1c1917" />
  
  <!-- Wheel Inner Highlights -->
  <circle cx="26" cy="48" r="1.5" fill="#ffffff" />
  <circle cx="38" cy="48" r="1.5" fill="#ffffff" />
</svg>
